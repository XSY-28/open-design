name: OpenDesign 9205 Windows deadline verification
on:
  push:
    branches: [codex/ci-open-design-9205-windows]
permissions:
  contents: read
jobs:
  tools-dev:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: 1a66c95be71d3ebd22aa0468ab48ee5ffde86a9d
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
      - run: pnpm install --filter "@open-design/tools-dev..." --filter "@open-design/metatool..." --frozen-lockfile --ignore-scripts
      - run: pnpm --filter "@open-design/tools-dev..." --if-present run build
      - run: pnpm --filter @open-design/tools-dev exec node --import tsx --test tests/cli-args.test.ts tests/sidecar-client.test.ts
